name: Release Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only one release build at a time across all tags — pushing v0.1.4 while
# v0.1.3 is still building cancels v0.1.3 immediately. Saves runner minutes
# and avoids racy concurrent draft creation on the same repo.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.os }}

    env:
      TAG: ${{ github.ref_name }}
      CHANNEL: ${{ contains(github.ref_name, '-beta') && 'beta' || contains(github.ref_name, '-rc') && 'rc' || contains(github.ref_name, '-dev') && 'dev' || 'stable' }}
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      WGR_CLIP_FETCH_FFMPEG: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets (universal)
        if: matrix.os == 'macos-14'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci

      - name: Fetch ffmpeg sidecars
        run: node scripts/rename-sidecars.mjs --all-targets

      - name: Install AzureSignTool (Windows)
        if: matrix.os == 'windows-latest'
        run: dotnet tool install --global AzureSignTool

      - name: Build Tauri application
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Developer ID signing + notarization. tauri-action sets up a
          # temporary keychain, imports the cert, signs the .app/.dmg and
          # submits to notarytool when all six are set. Empty on Windows.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "wgr-clip ${{ github.ref_name }}"
          releaseBody: "Drag-drop video transcoder for the web — by WGR. Auto-updates handled in-app from then on."
          releaseDraft: true
          prerelease: ${{ env.PRERELEASE }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # --- Windows code signing via Azure Key Vault ------------------------
      # Mirrors the Holtmed pattern. Skipped automatically when the Azure
      # secrets are missing (e.g. before the Key Vault is provisioned).

      - name: Locate NSIS EXE
        if: matrix.os == 'windows-latest'
        id: findexe
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
        run: |
          if (-not $env:AZURE_KEY_VAULT_URI) {
            "AZURE_KEY_VAULT_URI not set — skipping Windows code signing." | Write-Host
            "SKIP=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "NSIS setup EXE not found"; exit 1 }
          "EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EXENAME=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Found EXE: $($exe.FullName)"

      - name: Code-sign EXE (Azure Key Vault)
        if: matrix.os == 'windows-latest' && steps.findexe.outputs.SKIP != '1'
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERTIFICATE_NAME: ${{ secrets.AZURE_CERTIFICATE_NAME }}
        run: |
          azuresigntool sign `
            --file-digest sha256 `
            --azure-key-vault-url "$env:AZURE_KEY_VAULT_URI" `
            --azure-key-vault-client-id "$env:AZURE_CLIENT_ID" `
            --azure-key-vault-tenant-id "$env:AZURE_TENANT_ID" `
            --azure-key-vault-client-secret "$env:AZURE_CLIENT_SECRET" `
            --azure-key-vault-certificate "$env:AZURE_CERTIFICATE_NAME" `
            --timestamp-rfc3161 "http://timestamp.globalsign.com/tsa/r45standard" `
            --verbose `
            "${{ steps.findexe.outputs.EXE }}"

      - name: Regenerate Tauri minisig (post code-sign)
        if: matrix.os == 'windows-latest' && steps.findexe.outputs.SKIP != '1'
        shell: pwsh
        run: |
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
          cmd /c "npx tauri signer sign --private-key ""%TAURI_SIGNING_PRIVATE_KEY%"" --password """" ""${{ steps.findexe.outputs.EXE }}"""

      - name: Replace unsigned EXE + sig on draft release
        if: matrix.os == 'windows-latest' && steps.findexe.outputs.SKIP != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $exe = "${{ steps.findexe.outputs.EXE }}"
          $sig = "$exe.sig"
          if (-not (Test-Path $sig)) { $sig = "$exe.minisig" }
          if (-not (Test-Path $sig)) { Write-Error "Minisig not found next to EXE"; exit 1 }
          # Replace the unsigned EXE + its .sig on the draft. The final
          # cross-platform latest.json is rebuilt by the publish job below.
          gh release upload "$env:TAG" "$exe" --clobber
          gh release upload "$env:TAG" "$sig" --clobber

  publish:
    # Rebuilds latest.json from BOTH platforms' .sig files (authoritative
    # source) and then flips the draft to published. tauri-action and the
    # Windows post-sign step each upload their own latest.json that clobbers
    # the other, so we ignore both and reconstruct from the signature files.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild latest.json with all platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p sigs && cd sigs

          # Pull every sig file from the draft release (mac .app.tar.gz.sig +
          # win exe.sig). gh release download follows the right Accept headers
          # for asset binaries, unlike Invoke-WebRequest on the API .url field.
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" || true
          ls -la

          MAC_SIG_FILE=$(ls -1 wgr-clip_universal.app.tar.gz.sig 2>/dev/null || true)
          WIN_SIG_FILE=$(ls -1 *_x64-setup.exe.sig 2>/dev/null || true)

          if [ -z "$MAC_SIG_FILE" ] && [ -z "$WIN_SIG_FILE" ]; then
            echo "No platform signatures found — cannot build latest.json"
            exit 1
          fi

          PLATFORMS=""
          if [ -n "$MAC_SIG_FILE" ]; then
            MAC_SIG=$(tr -d '\n' < "$MAC_SIG_FILE" | sed 's/"/\\"/g')
            MAC_URL="https://github.com/${REPO}/releases/download/${TAG}/wgr-clip_universal.app.tar.gz"
            # Tauri updater on macOS keys both architectures to the universal bundle.
            PLATFORMS+=$'"darwin-x86_64":{"signature":"'"$MAC_SIG"$'","url":"'"$MAC_URL"$'"},'
            PLATFORMS+=$'"darwin-aarch64":{"signature":"'"$MAC_SIG"$'","url":"'"$MAC_URL"$'"}'
          fi
          if [ -n "$WIN_SIG_FILE" ]; then
            WIN_EXE_NAME="${WIN_SIG_FILE%.sig}"
            WIN_SIG=$(tr -d '\n' < "$WIN_SIG_FILE" | sed 's/"/\\"/g')
            WIN_URL="https://github.com/${REPO}/releases/download/${TAG}/${WIN_EXE_NAME}"
            [ -n "$PLATFORMS" ] && PLATFORMS+=","
            PLATFORMS+=$'"windows-x86_64":{"signature":"'"$WIN_SIG"$'","url":"'"$WIN_URL"$'"}'
          fi

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "wgr-clip ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": { ${PLATFORMS} }
          }
          EOF
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$REPO"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
